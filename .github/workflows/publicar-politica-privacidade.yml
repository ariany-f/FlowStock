name: Publicar política de privacidade (SFTP/FTP)

# Converte docs/privacidade.md em HTML e envia por FTP para o site.
# Configure em Settings > Secrets and variables > Actions:
#   FTP_SERVER      ex.: ftp.seusite.com.br (pode incluir :porta)
#   FTP_USERNAME    usuário do FTP
#   FTP_PASSWORD    senha do FTP
#   FTP_SERVER_DIR  pasta pública no servidor, terminando com / (ex.: public_html/ ou public_html/flowstock/)
# Opcional (Variables): FTP_PORT (padrão: 22) e FTP_PROTOCOL = sftp | ftp | ftps
# (padrão: sftp na porta 22, ftp nas demais)

on:
  push:
    paths:
      - docs/privacidade.md
      - .github/workflows/publicar-politica-privacidade.yml
  workflow_dispatch:

concurrency:
  group: publicar-politica-privacidade
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar HTML
        run: |
          mkdir -p site
          npm install --no-save --no-audit --no-fund marked@14
          node -e '
            const { marked } = require("marked");
            const fs = require("fs");
            const md = fs.readFileSync("docs/privacidade.md", "utf8");
            const html = `<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Política de Privacidade — FlowStock</title>
          <style>body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:760px;margin:0 auto;padding:32px 20px 64px;line-height:1.6;color:#1f2933}h1{font-size:1.8rem}h2{font-size:1.2rem;margin-top:32px}a{color:#0b5cad}</style>
          </head><body>${marked.parse(md)}</body></html>`;
            fs.writeFileSync("site/politica-de-privacidade.html", html);
          '
          ls -la site

      - name: Enviar por SFTP/FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          FTP_PORT: ${{ vars.FTP_PORT }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          # Aceita host com ou sem protocolo/porta (ex.: sftp://host:22, host:22, host)
          HOST="${FTP_SERVER#*://}"; HOST="${HOST%%/*}"
          PORT="${FTP_PORT}"
          if [[ "$HOST" == *:* ]]; then PORT="${PORT:-${HOST##*:}}"; HOST="${HOST%%:*}"; fi
          PORT="${PORT:-22}"
          PROTO="${FTP_PROTOCOL:-}"
          if [ -z "$PROTO" ]; then if [ "$PORT" = "22" ]; then PROTO=sftp; else PROTO=ftp; fi; fi
          echo "Enviando via $PROTO para porta $PORT, pasta '${FTP_SERVER_DIR}'"
          lftp -e "set net:timeout 20; set net:max-retries 2; set sftp:auto-confirm yes; set ftp:ssl-allow yes;             open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" -p $PORT $PROTO://$HOST;             cd \"${FTP_SERVER_DIR:-.}\" || mkdir -p \"${FTP_SERVER_DIR}\"; cd \"${FTP_SERVER_DIR:-.}\";             put site/politica-de-privacidade.html; ls politica-de-privacidade.html; bye"
