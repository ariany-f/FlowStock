name: 🍎 Publicar Apple (iOS & TestFlight)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil de Compilação iOS'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      auto_submit:
        description: 'Enviar automaticamente para a Apple App Store / TestFlight?'
        required: true
        default: false
        type: boolean

jobs:
  validate:
    name: 🔍 Validar Código (TypeScript & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔍 Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: 🧹 Lint (Expo)
        run: npx expo lint

  build-apple:
    name: 🍏 Compilar iOS para TestFlight
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🚀 Instalar EAS CLI Globalmente
        run: npm install -g eas-cli

      - name: 📦 Instalar Dependências do Projeto
        run: npm ci

      - name: 🔨 Compilar Pacote iOS no EAS (${{ inputs.profile }})
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          eas build --platform ios --profile ${{ inputs.profile }} --non-interactive

      - name: 📤 Submeter para Apple TestFlight
        if: inputs.auto_submit == true && inputs.profile == 'production'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit --platform ios --profile production --non-interactive
